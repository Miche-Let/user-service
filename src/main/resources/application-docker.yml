eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

spring:
  datasource:
    url: jdbc:postgresql://db:5432/michelet_db
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: user_service
        format_sql: true
    show-sql: true