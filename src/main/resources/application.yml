spring:
  application:
    name: user-service

server:
  port: 19100

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:1800}
  refresh-token-expiration-seconds: ${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:1209600}

cookie:
  refresh-token:
    secure: false
    same-site: Lax
    path: /api/v1/auth

internal:
  auth:
    secret: ${INTERNAL_AUTH_SECRET:test-internal-auth-secret-key-1234567890}

personal-info:
  secret: ${PERSONAL_INFO_SECRET:test-personal-info-secret-key-1234567890}
